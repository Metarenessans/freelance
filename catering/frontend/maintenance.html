<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service update | Chef Meal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 600px;
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            margin-bottom: 40px;
            font-weight: 600;
            font-size: 2.5rem;
            letter-spacing: 2px;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .logo-box {
            border: 2px solid #ffffff;
            padding: 5px 10px;
            display: inline-block;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: 400;
            background: linear-gradient(90deg, #ffffff 0%, #a1a1a1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #a1a1a1;
            margin-bottom: 30px;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 3px solid #333;
            border-bottom-color: #ffffff;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 0.9rem;
            color: #888;
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">Scheduled maintenance</div>
        <div class="logo">
            <span class="logo-box">CHEF MEAL</span>
        </div>
        <h1>Making our service better</h1>
        <p>We are carrying out a scheduled website update. <br> We will be back shortly.</p>
        <div class="loader"></div>
    </div>
</body>
</html>
