name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog and translations
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s bet-boom/tests -v
          python -m unittest discover -s dna/tests -v
          python -m unittest discover -s catering/tests -v
      - uses: actions/configure-pages@v5
      - name: Assemble static demos
        run: |
          mkdir -p _site/bet-boom _site/dna
          cp index.html _site/index.html
          cp avatar.png _site/avatar.png
          cp favicon* _site/ 2>/dev/null || true
          cp apple-touch-icon.png _site/ 2>/dev/null || true
          cp -R css _site/css 2>/dev/null || true
          cp -R scss _site/scss 2>/dev/null || true
          cp -R bet-boom/public/. _site/bet-boom/
          cp -R dna/. _site/dna/
          rm -rf _site/dna/tests _site/dna/sass
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
